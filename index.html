/* ================== FOTOGRAFIAS ================== */
function compress(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{let {width:w,height:h}=img;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('compressão falhou')),'image/jpeg',q)};img.onerror=()=>rej(new Error('formato de imagem não suportado'));img.src=u})}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function guardarFoto(blob){
  /* Fotografias guardadas na base de dados partilhada: as pessoas convidadas por email não veem ficheiros carregados por outros */
  if(S.assets&&window.PV_USE_ASSETS){try{const r=await S.assets.upload(blob);S.fotoCache[r.id]=await blobToData(blob);return {id:r.id,src:'asset'}}catch(e){if(!['not_granted','unavailable','capability_disabled'].includes(e.code))throw e}}
  const big=window.PV_FOTO_MAX;let b=await compress(blob,big||1000,big?.8:.6);let d=await blobToData(b);if(!big&&d.length>240000){b=await compress(blob,750,.5);d=await blobToData(b)}
  const id=uid();await S.db.doc('fotos/'+id).set({d,sid:S.sid});S.fotoCache[id]=d;return {id,src:'db'}}
async function fotoData(f){if(!f)return null;if(S.fotoCache[f.id]&&S.fotoCache[f.id].startsWith('data:'))return S.fotoCache[f.id];
  try{if(f.src==='asset'){const r=await fetch('/_blob/'+f.id);if(!r.ok)return null;const d=await blobToData(await r.blob());S.fotoCache[f.id]=d;return d}
    const d=await S.db.doc('fotos/'+f.id).get();if(d.exists){S.fotoCache[f.id]=d.data().d;return S.fotoCache[f.id]}}catch(e){}return null}

/* ================== LEITURA DA ETIQUETA ================== */
async function lerEtiqueta(){let e=curEq();const SID=S.sid,UID=S.eqUid;if(!e||!e.etiqueta||!(S.sample||window.__ocr))return;const k='ia_'+e.uid;S.busy[k]=true;S.msg[k]='';render();
  try{let blob=e._labelBlob;if(!blob){const d=await fotoData(e.etiqueta);if(!d)throw new Error('fotografia indisponível');blob=await (await fetch(d)).blob()}
    const cat=S.catalogo.map(c=>({id:c.id,modelo:c.modelo,codigo:c.codigo}));
    let r;
    if(!S.sample){r=await window.__ocr(blob,cat,t=>{S.msg['iap_'+e.uid]=t.charAt(0).toUpperCase()+t.slice(1)+'…';const b=document.querySelector('[data-act="ia-ler"]');if(b)b.innerHTML='<span class="spin"></span> '+esc(S.msg['iap_'+e.uid])})}else{
    const prompt=`A imagem é a etiqueta de características de um equipamento de ventilação (normalmente S&P / Soler & Palau, Brofer ou VIM). Extrai apenas o que está legível na etiqueta. Não inventes nem completes valores. Responde só com JSON neste formato:
{"modelo":string|null,"codigo":string|null,"numeroSerie":string|null,"dataProducao":string|null,"outros":string|null,"catalogoId":string|null}
- "numeroSerie": o valor (normalmente numérico) que aparece à frente ou por baixo de "Serial number", "Serial No.", "S/N", "SN", "N.º de série" ou "Nº série". Copia-o completo, sem espaços. Não confundas com o código do artigo.
- "codigo": referência/código do artigo (ex.: sequência numérica ou alfanumérica indicada como Code, Ref., Art.).
- "dataProducao": data ou semana/ano de fabrico tal como escrita.
- "outros": tensão, frequência, potência, corrente, IP e outros dados técnicos visíveis, numa linha curta.
- "catalogoId": o id do equipamento desta lista cujo modelo ou código coincide com a etiqueta; null se nenhum coincide claramente. Lista: ${JSON.stringify(cat)}`;
    r=await S.sample.json([{role:'user',content:prompt}],{images:[blob],modelTier:'default'});}
    e=findEq(SID,UID)||e;const _lb=e._labelBlob;
    const set=(f,v)=>{if(v&&String(v).trim())e[f]=String(v).trim()};
    set('modelo',r.modelo);set('codigo',r.codigo);set('nserie',r.numeroSerie);set('dataProducao',r.dataProducao);
    e.etiquetaDados={outros:r.outros||'',texto:r.texto||''};
    if(r.catalogoId&&S.catalogo.find(c=>c.id===r.catalogoId)){e.catalogoId=r.catalogoId;const c=S.catalogo.find(x=>x.id===r.catalogoId);if(c.familia)e.familia=c.familia}
    if(!e.familia&&e.modelo){const m=e.modelo.toUpperCase();const fk=Object.keys(FAM).find(f=>f!=='OUTRO'&&m.includes(f));if(fk)e.familia=fk}
    saveSvc(true,SID);S.msg[k]=S.sample?'Dados lidos. Confirme os campos abaixo.':'Texto lido. Confirme os campos. A leitura local falha mais em etiquetas gastas ou com reflexo.'}
  catch(er){S.msg[k]=er.code==='not_granted'?'!A leitura automática não foi autorizada. Preencha os campos à mão.':er.code==='rate_limited'?'!Demasiados pedidos seguidos. Tente daqui a um minuto.':'!Não foi possível ler a etiqueta. Preencha os campos à mão.'}
  S.busy[k]=false;S.msg['iap_'+e.uid]='';render()}

/* ================== ASSINATURAS ================== */
function afterRender(){document.querySelectorAll('canvas[data-sig]').forEach(cv=>initSig(cv,false))}
function initSig(cv,reset){const s=cur();const who=cv.dataset.sig;const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#142030';
  const existing=!reset&&s.assin?.[who];if(existing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=existing}
  if(cv._bound)return;cv._bound=true;let drawing=false,last=null,touched=false;
  const pt=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener('pointerdown',e=>{drawing=true;touched=true;last=pt(e);cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);const c=cv.getContext('2d');c.beginPath();c.moveTo(...last);c.lineTo(...p);c.stroke();last=p});
  const end=()=>{if(!drawing)return;drawing=false;if(!touched)return;const s2=cur();s2.assin=s2.assin||{};s2.assin[who]=exportSig(cv);s2.assin[who+'Em']=new Date().toISOString();saveSvc()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end)}
function exportSig(cv){const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;const c=o.getContext('2d');c.drawImage(cv,0,0);
  const id=c.getImageData(0,0,o.width,o.height);const d=id.data;for(let i=0;i<d.length;i+=4){if(d[i+3]>20){d[i]=d[i+1]=d[i+2]=20}}c.putImageData(id,0,0);
  const sm=document.createElement('canvas');const k=Math.min(1,700/o.width);sm.width=Math.round(o.width*k);sm.height=Math.round(o.height*k);sm.getContext('2d').drawImage(o,0,0,sm.width,sm.height);return sm.toDataURL('image/png')}

/* ================== PDF ================== */
async function gerarPDF(){const s=cur();S.busy.pdf=true;S.msg.pdf='';render();
  try{if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('biblioteca de PDF não carregou — verifique a ligação à internet');
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const W=210,M=14,BL=[227,6,19],GR=[236,236,238];const COM=s.tipo==='COM';let y=0;
  const tit=s.tipo==='COM'?'RELATÓRIO DE COMISSIONAMENTO':'RELATÓRIO DE INTERVENÇÃO';
  doc.setFillColor(...(COM?BL:[178,178,180]));doc.rect(0,0,W,24,'F');doc.setFillColor(255,255,255);doc.roundedRect(M,3.5,17,17,1.6,1.6,'F');doc.addImage(LOGO,'PNG',M,3.5,17,17);doc.setTextColor(...(COM?[255,255,255]:[26,26,28]));doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(tit,M+22,11);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text('S&P Portugal · Serviço de Assistência Técnica',M+22,17.5);
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Nº '+(s.numero||''),W-M,11,{align:'right'});doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text(fmtD(s.data),W-M,17.5,{align:'right'});
  doc.setTextColor(20);y=32;
  const ensure=h=>{if(y+h>282){doc.addPage();y=16}};
  const sec=t=>{ensure(14);doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(...BL);doc.text(t.toUpperCase(),M,y);doc.setDrawColor(...BL);doc.setLineWidth(.4);doc.line(M,y+1.6,W-M,y+1.6);doc.setTextColor(20);y+=6};
  const PT=t=>typeof t==='string'?t.replace(/³/g,'3').replace(/²/g,'2'):t;const fixRows=rs=>rs&&rs.map(r=>r.map(c=>c&&typeof c==='object'&&'content' in c?Object.assign({},c,{content:PT(c.content)}):PT(c)));
  const AT=(opt)=>{if(opt.body)opt.body=fixRows(opt.body);if(opt.head)opt.head=fixRows(opt.head);doc.autoTable(Object.assign({startY:y,margin:{left:M,right:M,top:16,bottom:16},theme:'grid',styles:{fontSize:8.6,cellPadding:1.7,lineColor:[200,207,217],lineWidth:.15,textColor:20},headStyles:{fillColor:BL,textColor:255,fontStyle:'bold'}},opt));y=doc.lastAutoTable.finalY+5};
  const kv=rows=>AT({body:rows.filter(r=>r[1]!==undefined),columnStyles:{0:{fontStyle:'bold',cellWidth:46,fillColor:GR}}});
  const para=t=>{doc.setFont('helvetica','normal');doc.setFontSize(9.5);const ls=doc.splitTextToSize(t&&t.trim()?t:'—',W-2*M);ls.forEach(l=>{ensure(5);doc.text(l,M,y);y+=4.6});y+=3};
  const dash=v=>v&&String(v).trim()?String(v):'—';
  const drawPhotos=async list=>{const cw=(W-2*M-6)/2;let col=0,rowH=0;
      for(const [j,ph] of list.entries()){const d=await fotoData(ph);let ih=cw*0.75;let dims=null;if(d)dims=await imgDims(d);
        if(dims&&dims.w/dims.h>1.8){if(col===1){y+=rowH+5;rowH=0;col=0}const fw=W-2*M;const fh=Math.min(fw*dims.h/dims.w,90);doc.setFont('helvetica','normal');doc.setFontSize(8.5);const cl2=doc.splitTextToSize(ph._cap||'',fw);ensure(fh+2+cl2.length*4+2);doc.addImage(d,'JPEG',M,y,Math.min(fw,fh*dims.w/dims.h),fh);if(cl2.length){doc.setTextColor(60);doc.text(cl2,M,y+fh+4);doc.setTextColor(20)}y+=fh+2+cl2.length*4+5;continue}
        if(dims)ih=Math.min(cw*dims.h/dims.w,75);
        doc.setFont('helvetica','normal');doc.setFontSize(8.5);const cl=doc.splitTextToSize(ph._cap||'',cw);const h=ih+2+cl.length*4;
        if(col===0)ensure(h+2);const x=M+col*(cw+6);
        if(d){const iw=dims?Math.min(cw,ih*dims.w/dims.h):cw;doc.addImage(d,'JPEG',x+(cw-iw)/2,y,iw,ih)}else{doc.setDrawColor(200);doc.rect(x,y,cw,ih);doc.text('Fotografia indisponível',x+cw/2,y+ih/2,{align:'center'})}
        if(cl.length){doc.setTextColor(60);doc.text(cl,x,y+ih+4);doc.setTextColor(20)}rowH=Math.max(rowH,h);
        if(col===1||j===list.length-1){y+=rowH+5;rowH=0;col=0}else col=1}};
  kv([['Cliente',dash(s.cliente?.nome)],['Contacto',dash([s.cliente?.contacto,s.cliente?.email].filter(Boolean).join(' · '))],['Assunto',dash(s.assunto)],
     ['Obra / local',dash([s.local?.obra,s.local?.morada,s.local?.localidade].filter(Boolean).join(', '))],
     ['Instalador',dash([s.instalador?.nome,s.instalador?.localidade].filter(Boolean).join(' · '))],['Resp. instalador',dash([s.instalador?.responsavel,s.instalador?.contacto,s.instalador?.email].filter(Boolean).join(' · '))],
     ['Técnico responsável',dash(s.tecnico)],['Data da intervenção',dash(fmtD(s.data))]]);
  if(s.tipo==='AT'){sec('Descrição da avaria');para(s.avaria)}
  let anyVerf=false;let fotoN=0;
  const hasX=d=>!!(d&&((d.c&&d.c.trim())||(d.fotos||[]).length));
  const extras=async(d,code)=>{if(!hasX(d))return;y-=2;
    if(d.c&&d.c.trim()){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(50);const ls=doc.splitTextToSize(PT('Comentário ('+code+'): '+d.c.trim()),W-2*M-4);ls.forEach(l=>{ensure(5);doc.text(l,M+2,y+3);y+=4.4});doc.setTextColor(20);y+=2}
    if((d.fotos||[]).length){y+=1;await drawPhotos(d.fotos.map(ph=>({...ph,_cap:'Foto '+(++fotoN)+' · ponto '+code})))}
    y+=2};
  for(const [i,e] of (s.equipamentos||[]).entries()){
    doc.addPage();y=16;
    sec(`Equipamento ${i+1} · ${e.modelo||'Modelo por identificar'}`);
    kv([['Modelo',dash(e.modelo)],['Código',dash(e.codigo)],['Nº de série',dash(e.nserie)],['Data de produção',dash(e.dataProducao)],['Ref.ª / data da fatura',dash([e.refFatura,fmtD(e.dataFatura)].filter(Boolean).join(' · '))],...(e.ref?[['Referência interna',e.ref]]:[])]);
    const f=e.ficha||{};const fam=FAM[e.familia]||FAM.OUTRO;const oc=new Set(e.ocultos||[]);const ok=([c])=>!oc.has(keyOf(c));const hx=c=>{const d=f[keyOf(c)]||{};return !!(d.c&&d.c.trim()||(d.fotos||[]).length)};const nm=(c,n)=>n+(hx(c)?' (ver anexo)':'');
    for(const sc of secoes(s,e)){
      if(sc.kind==='caud'){
        const cRows=(cod,lista)=>[...lista.map((n,j)=>[cod+'.'+(j+1),n]),...Array.from({length:N_OUTROS},(_,j)=>[cod+'.'+(lista.length+j+1),null])].filter(ok).map(([c,n])=>{const d=f[keyOf(c)]||{};return (d.p||d.r||hasX(d))?{c,d,row:[c,n||d.n||'Outros',d.p||'',d.r||'',desvio(d.p,d.r)]}:null}).filter(Boolean);
        const ce=cRows('7.5.1',EXT),ci=cRows('7.5.2',INS);
        if(ce.length||ci.length){ensure(20);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text('7.5 Caudal por ponto (m3/h)',M,y);y+=2;
          const all=[...(ce.length?[{grp:'Extração'},...ce]:[]),...(ci.length?[{grp:'Insuflação'},...ci]:[])];
          let chunk=[],first=true;
          const flush=()=>{if(!chunk.length)return;AT({head:first?[['Ref.','Compartimento','Proj.','Real','Desvio']]:undefined,showHead:first?'firstPage':'never',body:chunk,columnStyles:{0:{cellWidth:18},2:{cellWidth:20,halign:'right'},3:{cellWidth:20,halign:'right'},4:{cellWidth:18,halign:'right'}}});first=false;chunk=[]};
          for(const r of all){if(r.grp){chunk.push([{content:r.grp,colSpan:5,styles:{fontStyle:'bold',fillColor:GR}}]);continue}
            chunk.push(r.row);if(hasX(r.d)){flush();await extras(r.d,r.c)}}
          flush()}
        continue}
      const its=sc.items.filter(x=>!oc.has(x.k)).filter(x=>f[x.k]?.e||f[x.k]?.v||hasX(f[x.k]));if(!its.length)continue;
      const hasRef=sc.items.some(x=>x.ref!==undefined),hasVal=sc.items.some(x=>x.val),hasSt=sc.items.some(x=>x.states);
      const head=['Ref.','Item',...(hasRef?['Ref. manual']:[]),...(hasVal?['Especificação / valor']:[]),...(hasSt?['Estado']:[])];
      const rowOf=x=>{const d=f[x.k]||{};if(d.e==='verf')anyVerf=true;return [x.c,x.n,...(hasRef?[x.ref||'']:[]),...(hasVal?[d.v||'']:[]),...(hasSt?[ST[d.e]||'']:[])]};
      const cs={0:{cellWidth:16}};let ci=2;if(hasRef)cs[ci++]={cellWidth:22};if(hasVal)cs[ci++]={cellWidth:34};if(hasSt)cs[ci++]={cellWidth:16};
      const stCol=hasSt?head.length-1:-1;
      ensure(20);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text(PT(sc.code+' '+sc.title),M,y);y+=2;
      let chunk=[],first=true;
      const flush=()=>{if(!chunk.length)return;AT({head:first?[head]:undefined,showHead:first?'firstPage':'never',body:chunk,columnStyles:cs,didParseCell:d=>{if(d.section==='body'&&d.column.index===stCol&&d.cell.raw==='Verf*')d.cell.styles.textColor=[168,95,0]}});first=false;chunk=[]};
      for(const x of its){chunk.push(rowOf(x));const d=f[x.k];if(hasX(d)){flush();await extras(d,x.c)}}
      flush()}
    const ac=(e.acoes||[]);
    ensure(20);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text('Ações realizadas',M,y);y+=2;
    if(ac.length)AT({head:[['Ação','Peça (código · designação)','Qtd.','Nota']],body:ac.map(a=>[ACOES.find(x=>x[0]===a.tipo)?.[1]||a.tipo,[a.codigo,a.designacao].filter(Boolean).join(' · ')||'—',a.qtd||'',a.nota||'']),columnStyles:{0:{cellWidth:40},2:{cellWidth:12,halign:'center'}}});
    else{y+=3;para('Sem ações registadas.')}
    const gerais=e.fotos||[];
    if(gerais.length){ensure(16);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text('Outras fotografias',M,y);y+=4;await drawPhotos(gerais.map(ph=>({...ph,_cap:'Foto '+(++fotoN)+(ph.c?' — '+PT(ph.c):'')})))}
  }
  doc.addPage();y=16;
  sec('Análise da intervenção');para(s.analise);
  sec('Recomendações');para(s.recomendacoes);
  if(s.observacoes){sec('Observações');para(s.observacoes)}
  ensure(10);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Garantia:',M,y);doc.setFont('helvetica','normal');doc.text(s.garantia==='sim'?'Sim':s.garantia==='nao'?'Não':'—',M+20,y);y+=6;
  if(anyVerf){doc.setFontSize(8.5);doc.setTextColor(90);doc.text('Verf* — necessária verificação e/ou ação corretiva',M,y);doc.setTextColor(20);y+=6}
  ensure(48);const a=s.assin||{};const sw=(W-2*M-10)/2;
  [['tecnico','Técnico responsável',a.nomeTecnico||s.tecnico],['cliente','Cliente',a.nomeCliente||s.cliente?.nome]].forEach(([k,l,n],i)=>{const x=M+i*(sw+10);
    if(a[k])doc.addImage(a[k],'PNG',x,y,Math.min(sw,70),26);doc.setDrawColor(120);doc.line(x,y+28,x+sw,y+28);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(l,x,y+33);doc.setFont('helvetica','normal');doc.text(n||'',x,y+38)});
  y+=42;
  const np=doc.getNumberOfPages();for(let p=1;p<=np;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(110);doc.text('Serviço de Assistência Técnica | S&P Portugal',M,291);doc.text(`${s.numero} · Página ${p}/${np}`,W-M,291,{align:'right'})}
  const nome=`${s.numero} - ${(s.cliente?.nome||'Cliente').replace(/[\\/:*?"<>|]/g,'')}.pdf`;
  const blob=doc.output('blob');
  if(STANDALONE()&&window.PV_MODE==='local'){setOut('pdf',blob,nome,'Partilhe com o cliente por email ou WhatsApp, ou guarde no OneDrive.');S.busy.pdf=false;S.msg.pdf='';render();return}
  if(!S.downloads)throw new Error('a gravação de ficheiros não está disponível nesta vista');
  const r=await S.downloads.save({filename:nome,data:blob});
  S.msg.pdf=(r&&r.msg)?r.msg:'PDF entregue: '+nome+'. Envie-o ao cliente a partir da pasta de transferências ou da partilha do telemóvel.'}
  catch(er){S.msg.pdf=er.code==='declined'?'!Gravação cancelada.':'!Não foi possível gerar o PDF: '+(er.message||er.code)}
  S.busy.pdf=false;render()}
function imgDims(d){return new Promise(r=>{const i=new Image();i.onload=()=>r({w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>r(null);i.src=d})}
