<title>Pós-Venda S&amp;P</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: cabeçalho vermelho S&P contínuo com um painel de entrada (início), coluna de trabalho de 760px, ações principais em mosaicos grandes para o polegar */
:root{
  --bg:#f3f3f4; --surface:#ffffff; --ink:#141416; --muted:#64646b; --line:#e2e2e5; --line-strong:#cfcfd4;
  --brand:#e30613; --brand-deep:#b80510; --brand-ink:#ffffff; --brand-soft:#fde7e8;
  --accent:#e30613; --accent-ink:#ffffff; --chip:#ededef; --paper:#ffffff;
  --ok:#1d7a4c; --ok-soft:#e2f2ea; --warn:#a85d00; --warn-soft:#fbefdc; --bad:#c4121c;
  --shadow:0 1px 2px rgba(20,20,22,.06),0 4px 14px rgba(20,20,22,.05);
  --f-disp:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1b1b1e; --ink:#ededf0; --muted:#a2a2aa; --line:#2b2b30; --line-strong:#3a3a40;
  --brand:#c8101b; --brand-deep:#9c0c15; --brand-ink:#ffffff; --brand-soft:#3a1517;
  --accent:#ff4d57; --accent-ink:#1a0406; --chip:#26262a;
  --ok:#4cc28a; --ok-soft:#163026; --warn:#f0a531; --warn-soft:#3a2c14; --bad:#ff6b73;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1b1b1e; --ink:#ededf0; --muted:#a2a2aa; --line:#2b2b30; --line-strong:#3a3a40;
  --brand:#c8101b; --brand-deep:#9c0c15; --brand-ink:#ffffff; --brand-soft:#3a1517;
  --accent:#ff4d57; --accent-ink:#1a0406; --chip:#26262a;
  --ok:#4cc28a; --ok-soft:#163026; --warn:#f0a531; --warn-soft:#3a2c14; --bad:#ff6b73;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}

/* Cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px;min-height:78px}
.logo{width:58px;height:58px;flex:none;border-radius:9px;background:#fff;display:block}
.brand{font-family:var(--f-disp);font-weight:700;font-size:21px;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:.2px;margin-top:2px}
header.top .ghost{color:var(--accent);padding:8px 4px;font-size:15px;white-space:nowrap}

/* Painel de entrada */
.hero{background:var(--surface);color:var(--ink);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 22px;position:relative;z-index:1;display:flex;flex-direction:column;gap:16px}
.hero .arcs{position:absolute;right:-120px;top:-10px;width:280px;height:280px;pointer-events:none;color:var(--brand);opacity:.09}
.hero h1{font-size:38px;line-height:1;letter-spacing:-.2px}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-disp);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.2}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
.tile{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;box-shadow:var(--shadow);min-height:72px}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile .ic svg{width:24px;height:24px}
.tile b{display:block;font-family:var(--f-disp);font-size:18px;line-height:1.1}
.tile small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.ic.at{background:var(--brand-soft);color:var(--accent)}
.ic.com{background:var(--ink);color:var(--surface)}
.ic.eq{background:var(--chip);color:var(--ink)}

h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:18px;letter-spacing:.1px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-size:12.5px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* Painéis e secções */
.panel{background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sect{display:flex;flex-direction:column;gap:12px}
.sect-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sect-h .code{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--accent);background:var(--brand-soft);padding:2px 7px;border-radius:6px}
.list-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* Formulários */
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f span{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;width:100%;min-width:0;min-height:46px}
textarea{min-height:96px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--brand-soft)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{position:relative}
.search input{padding-left:40px;border-radius:12px;border-color:var(--line)}
.search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* Botões */
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:600;min-height:44px}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.pri:active{background:var(--brand-deep)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px;min-height:0}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.sm{padding:6px 12px;font-size:13.5px;min-height:34px}
button:disabled{opacity:.45;cursor:not-allowed}

/* Separadores */
.tabs{display:flex;gap:2px;background:var(--chip);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;border:0;background:transparent;padding:9px 12px;font-size:14.5px;white-space:nowrap;color:var(--muted);min-height:40px;border-radius:9px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs.under{background:transparent;padding:0;border-bottom:1px solid var(--line);border-radius:0;gap:14px}
.tabs.under.sticky-sub{background:var(--bg)}
.tabs.under button{flex:none;padding:10px 2px;border-radius:0;border-bottom:3px solid transparent;background:transparent;box-shadow:none}
.tabs.under button.on{color:var(--ink);border-bottom-color:var(--brand);background:transparent;box-shadow:none}
.sticky-sub{position:sticky;top:calc(env(safe-area-inset-top,0px) + 79px);z-index:4;background:var(--bg);padding-block:8px;margin-top:-8px}

/* Etiquetas de estado */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.at{background:var(--brand-soft);color:var(--accent)}
.pill.com{background:var(--chip);color:var(--ink)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.open{background:var(--warn-soft);color:var(--warn)}

/* Cartões */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;box-shadow:var(--shadow);font-weight:400}
.card:active{transform:scale(.995)}
.card .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;align-self:start}
.card .ic svg{width:22px;height:22px}
.card .mid{display:flex;flex-direction:column;gap:4px;min-width:0}
.card .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .t b{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--muted)}
.card .n{font-weight:600;font-size:16.5px;line-height:1.25}
.card .s{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .chev{color:var(--line-strong);width:18px;height:18px}
.card .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.empty{background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-disp);font-size:18px}

/* Barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.bar .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:8px}
.bar .in button{flex:1;min-height:48px}

/* Ficha */
.chk{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.chk:first-of-type{border-top:0}
.chk .c{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:3px;min-width:50px}
.chk .body{display:flex;flex-direction:column;gap:7px;min-width:0}
.chk .ref{font-size:12.5px;color:var(--muted)}
.chk .ref b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.chk .note{font-size:12.5px;color:var(--warn);font-weight:600}
.seg{display:inline-flex;gap:0;background:var(--chip);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;font-size:13.5px;background:transparent;border:0;color:var(--muted);min-height:34px;border-radius:8px}
.seg button.on{color:#fff}
.seg button.on[data-v="sim"],.seg button.on[data-v="ok"]{background:var(--ok)}
.seg button.on[data-v="nao"]{background:var(--bad)}
.seg button.on[data-v="na"]{background:var(--muted)}
.seg button.on[data-v="verf"]{background:var(--warn)}
.caud{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.caud th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:4px}
.caud td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.caud td input{padding:8px;min-height:40px}
.caud td.c{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.caud td.d{font-size:12.5px;text-align:right;white-space:nowrap;color:var(--muted);width:52px;font-weight:600}
.tbl-wrap{overflow-x:auto}

/* Fotografias */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ph .img{aspect-ratio:4/3;background:var(--chip);display:flex;align-items:center;justify-content:center;max-width:100%}
.ph .img img{width:100%;height:100%;object-fit:cover}
.ph textarea{border:0;border-top:1px solid var(--line);border-radius:0;min-height:60px;font-size:13.5px;box-shadow:none}
.ph .x{display:flex;justify-content:flex-end;gap:4px;padding:2px 4px}
.label-shot{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:start}
@media (max-width:520px){.label-shot{grid-template-columns:1fr}}
.label-shot .img{aspect-ratio:4/3;border-radius:10px;background:var(--chip);overflow:hidden;display:flex;align-items:center;justify-content:center;max-width:100%;border:1.5px dashed var(--line-strong)}
.label-shot .img img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden;display:inline-flex}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}

/* Ações e assinaturas */
.act{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.act:first-child{border-top:0}
.act .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:7px}
.act .m{font-weight:600}
.sig{display:flex;flex-direction:column;gap:8px}
.sig canvas{width:100%;height:160px;background:var(--paper);border:1.5px dashed var(--line-strong);border-radius:12px;touch-action:none}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14.5px}
.ok-msg{color:var(--ok);font-weight:600}
.err-msg{color:var(--bad);font-weight:600}
.prog{display:block;height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:3px}
.confirm{border:1px solid var(--bad);background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pecas{width:100%;border-collapse:collapse}
.pecas td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.pecas th{font-size:12px;color:var(--muted);text-align:left;padding:4px;font-weight:600}
.pecas td input,.pecas td select{padding:8px;font-size:14px;min-height:40px}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;max-width:728px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.syncbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--chip);color:var(--ink)}
.syncbar.warn{background:var(--warn-soft)}.syncbar.bad{background:var(--brand-soft)}.syncbar.info{background:var(--chip)}
.syncbar button{min-height:34px;padding:5px 12px;font-size:13px}
#syncbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:7;max-width:736px;margin:0 auto;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px 12px}
body:has(#bar:not([hidden])) #syncbar{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.login-logo{width:96px;height:96px;border-radius:12px}
.login h1{font-size:34px}
.login .pri{width:100%;min-height:52px;font-size:16px}
.interna{background:var(--warn-soft);border-color:transparent}
.interna .lock{color:var(--warn);display:inline-flex}
.interna textarea{background:var(--surface)}
.pill.ref{background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-weight:500}
.pill.ref::before{display:none}
.pill.int{background:var(--warn-soft);color:var(--warn)}
.outp{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line-strong);border-radius:12px;padding:12px;background:var(--bg)}
.pickf{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.ptx{display:flex;flex-direction:column;gap:6px}
.ptb{display:flex;gap:2px;flex-wrap:wrap;margin-left:-8px}
.ptb .ghost{font-size:13px;padding:4px 8px;color:var(--muted)}
.ptb .hide-b{margin-left:auto}
.pthumbs{display:flex;gap:8px;flex-wrap:wrap}
.pth{position:relative;width:84px;height:64px;border-radius:8px;overflow:hidden;background:var(--chip)}
.pth img{width:100%;height:100%;object-fit:cover}
.pth .x{position:absolute;top:3px;right:3px;min-height:0;padding:1px 6px;font-size:12px;background:var(--surface);border-color:transparent;border-radius:6px}
.pth .danger{position:absolute;inset:auto 3px 3px 3px;min-height:0;padding:2px;font-size:12px;background:var(--surface)}
.hidbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;padding-top:8px;border-top:1px dashed var(--line)}
.hidbar button{min-height:30px;padding:3px 9px;font-size:12.5px;font-family:var(--f-mono);font-weight:500}
.caud td.m{width:34px;text-align:center}
.caud td.m .ghost{padding:4px 6px;color:var(--muted)}
.caud tr.ptrow td{border-top:0;padding-top:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.card:active{transform:none}}
</style>

<header class="top"><div class="in" id="hdr"></div></header>
<div id="syncbar" class="syncbar" hidden></div>
<section class="hero" id="hero" hidden></section>
<main class="wrap" id="app"><div class="empty"><span class="spin"></span>A ligar à base de dados…</div></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="bar" id="bar" hidden><div class="in" id="barin"></div></div>

<script>
/* Pós-Venda S&P · armazenamento
   - Guarda tudo primeiro neste dispositivo (IndexedDB), para funcionar sem rede.
   - Com PV_CONFIG.clientId preenchido: login Microsoft (MSAL) e sincronização com a pasta partilhada do OneDrive/SharePoint.
   - Sem clientId: modo local (só neste dispositivo). */
(function(){
  const CFG=window.PV_CONFIG||{};
  const CLOUD=!!(CFG.clientId&&String(CFG.clientId).trim());
  window.PV_MODE=CLOUD?'cloud':'local';
  window.PV_FOTO_MAX=1600;
  const SCOPES=['User.Read','Files.ReadWrite.All'];
  const PASTA_PADRAO='Pós-Venda S&P';
  const GRAPH='https://graph.microsoft.com/v1.0';

  /* ---------- armazenamento local ---------- */
  const DBN='posvenda_sp_v2';let dbp=null;
  const idb=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs');r.result.createObjectStore('meta')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  async function op(store,mode,fn){const d=await idb();const t=d.transaction(store,mode);const out=await fn(t.objectStore(store));await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});return out}
  const lget=(s,k)=>op(s,'readonly',st=>req(st.get(k)));
  const lput=(s,k,v)=>op(s,'readwrite',st=>req(st.put(v,k)));
  const ldel=(s,k)=>op(s,'readwrite',st=>req(st.delete(k)));
  const lall=(s,prefix)=>op(s,'readonly',st=>new Promise((res,rej)=>{const out=[];const rq=st.openCursor(prefix?IDBKeyRange.bound(prefix,prefix+'￿'):undefined);rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)}));
  const clone=v=>v instanceof Blob?v:JSON.parse(JSON.stringify(v));

  /* migração da versão de teste anterior (posvenda_sp_local) */
  async function migrar(){try{if(localStorage.getItem('pv_migr'))return}catch(e){}
    try{const ex=await lall('docs','servicos/');if(ex.length)return;
      const old=await new Promise(res=>{const r=indexedDB.open('posvenda_sp_local');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onupgradeneeded=()=>{r.transaction.abort();res(null)}});
      if(old&&old.objectStoreNames.contains('docs')){const rows=await new Promise(res=>{const out=[];const t=old.transaction('docs','readonly');const rq=t.objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};rq.onerror=()=>res(out)});
        for(const [k,v] of rows){await lput('docs',k,v);if(CLOUD)await lput('meta',k,{dirty:true,v:1})}old.close()}
      try{localStorage.setItem('pv_migr','1')}catch(e){}}catch(e){}}

  /* ---------- subscrições ---------- */
  const subs={};
  async function emit(c){const rows=await lall('docs',c+'/');const docs=rows.filter(([k])=>!k.slice(c.length+1).includes('/')).map(([k,v])=>({id:k.slice(c.length+1),exists:true,data:()=>clone(v)}));(subs[c]||[]).forEach(fn=>{try{fn({docs,size:docs.length,empty:!docs.length})}catch(e){}})}

  /* ---------- estado e barra de sincronização ---------- */
  const ST={state:CLOUD?'idle':'local',pending:0,msg:''};
  function bar(){const el=document.getElementById('syncbar');if(!el)return;let t='',cls='',btn='';
    if(!CLOUD){el.hidden=true;return}
    if(ST.state==='login'){t='A sessão Microsoft expirou. As alterações ficam guardadas neste telemóvel até confirmar a conta.';cls='warn';btn='<button type="button" id="pv-relogin">Confirmar conta</button>'}
    else if(ST.state==='offline'){t='Sem rede'+(ST.pending?' · '+ST.pending+' alteração(ões) por enviar. Seguem quando houver ligação.':'. Pode continuar a trabalhar.');cls='warn'}
    else if(ST.state==='error'){t='Não foi possível sincronizar com o OneDrive ('+ST.msg+'). Nova tentativa automática.';cls='bad'}
    else if(ST.pending){t='A enviar '+ST.pending+' alteração(ões) para o OneDrive…';cls='info'}
    el.className='syncbar '+cls;el.innerHTML=t?`<span>${t}</span>${btn}`:'';el.hidden=!t;
    const b=document.getElementById('pv-relogin');if(b)b.onclick=()=>relogin()}
  async function countPending(){if(!CLOUD)return 0;const m=await lall('meta');ST.pending=m.filter(([,v])=>v&&v.dirty).length;bar();return ST.pending}

  /* ---------- autenticação ---------- */
  let app=null,account=null;
  async function auth(){
    if(!window.msal)throw new Error('biblioteca de login não carregou');
    app=new msal.PublicClientApplication({auth:{clientId:CFG.clientId.trim(),authority:'https://login.microsoftonline.com/'+((CFG.tenantId||'').trim()||'organizations'),redirectUri:location.origin+location.pathname,navigateToLoginRequestUrl:false},cache:{cacheLocation:'localStorage'}});
    await app.initialize();
    let res=null;try{res=await app.handleRedirectPromise()}catch(e){console.warn(e)}
    account=(res&&res.account)||app.getActiveAccount()||app.getAllAccounts()[0]||null;
    if(account){app.setActiveAccount(account);return account}
    loginScreen();return new Promise(()=>{});
  }
  function loginScreen(){const h=document.getElementById('hero');if(h)h.hidden=true;const a=document.getElementById('app');
    a.innerHTML=`<div class="login"><img src="${window.LOGO||''}" alt="S&amp;P" class="login-logo"><h1>Pós-Venda</h1><p class="muted">Assistência técnica e comissionamento. Entre com a sua conta Microsoft da S&amp;P para ver e registar serviços.</p><button class="pri" id="pv-login" type="button">Entrar com a conta Microsoft</button><p class="muted" style="font-size:13px">Os relatórios e fotografias ficam guardados na pasta partilhada do OneDrive.</p></div>`;
    document.getElementById('pv-login').onclick=()=>app.loginRedirect({scopes:SCOPES,prompt:'select_account'})}
  function relogin(){app&&app.acquireTokenRedirect({scopes:SCOPES,account})}
  async function token(){
    try{const r=await app.acquireTokenSilent({scopes:SCOPES,account});return r.accessToken}
    catch(e){if(e instanceof msal.InteractionRequiredAuthError||/interaction_required|login_required|consent_required/.test(e.errorCode||'')){ST.state='login';bar();const er=new Error('sessão expirada');er.login=true;throw er}throw e}}

  /* ---------- Graph ---------- */
  async function g(method,url,body,headers={},raw){
    const tk=await token();
    const r=await fetch(url.startsWith('http')?url:GRAPH+url,{method,headers:Object.assign({Authorization:'Bearer '+tk},headers),body});
    if(r.status===429||r.status===503){const ra=+(r.headers.get('Retry-After')||5);const er=new Error('serviço ocupado');er.retry=ra;throw er}
    if(raw)return r;
    if(!r.ok){let m='';try{const j=await r.json();m=j.error&&(j.error.message||j.error.code)}catch(e){}const er=new Error(m||('erro '+r.status));er.status=r.status;throw er}
    const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r;
  }
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  let ROOT=null;
  async function root(){
    if(ROOT)return ROOT;
    const ck='pv_root_'+(CFG.pastaLink||'me');
    try{const c=JSON.parse(localStorage.getItem(ck)||'null');if(c&&c.driveId){ROOT=c;return ROOT}}catch(e){}
    let it;
    if(CFG.pastaLink&&CFG.pastaLink.trim()){
      const b64=btoa(unescape(encodeURIComponent(CFG.pastaLink.trim()))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
      it=await g('GET','/shares/u!'+b64+'/driveItem',null,{Prefer:'redeemSharingLink'});
    }else{
      try{it=await g('GET','/me/drive/root:/'+enc(PASTA_PADRAO))}
      catch(e){if(e.status!==404)throw e;it=await g('POST','/me/drive/root/children',JSON.stringify({name:PASTA_PADRAO,folder:{},'@microsoft.graph.conflictBehavior':'fail'}),{'Content-Type':'application/json'})}
    }
    ROOT={driveId:it.parentReference&&it.parentReference.driveId||(it.remoteItem&&it.remoteItem.parentReference.driveId),id:it.remoteItem?it.remoteItem.id:it.id};
    for(const f of ['servicos','catalogo','fotos','relatorios']){
      try{await g('POST',`/drives/${ROOT.driveId}/items/${ROOT.id}/children`,JSON.stringify({name:f,folder:{},'@microsoft.graph.conflictBehavior':'fail'}),{'Content-Type':'application/json'})}catch(e){if(e.status!==409)throw e}}
    try{localStorage.setItem(ck,JSON.stringify(ROOT))}catch(e){}
    return ROOT;
  }
  const at=rel=>`/drives/${ROOT.driveId}/items/${ROOT.id}:/${enc(rel)}:`;
  const fileOf=path=>{const [c,id]=path.split(/\/(.*)/s);return c==='fotos'?`fotos/${id}.jpg`:c==='relatorios'?`relatorios/${id}`:`${c}/${id}.json`};
  function dataURLtoBlob(d){const [h,b]=d.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
  const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});

  /* ---------- sincronização ---------- */
  let syncing=false,again=false,timer=null;
  function soon(ms=1200){if(!CLOUD)return;clearTimeout(timer);timer=setTimeout(sync,ms)}
  async function push(){
    const metas=(await lall('meta')).filter(([,m])=>m&&m.dirty);
    for(const [path,m] of metas){
      const file=fileOf(path);
      if(m.deleted){const r=await g('DELETE',at(file),null,{},true);if(!r.ok&&r.status!==404){const er=new Error('erro '+r.status);er.status=r.status;throw er}
        const cur=await lget('meta',path);if(cur&&cur.v===m.v)await ldel('meta',path);continue}
      const val=await lget('docs',path);if(val===undefined){await ldel('meta',path);continue}
      let body,ct;
      if(path.startsWith('fotos/')){body=dataURLtoBlob(val.d);ct='image/jpeg'}
      else if(path.startsWith('relatorios/')){body=val;ct='application/pdf'}
      else{body=new Blob([JSON.stringify(val)],{type:'application/json'});ct='application/json'}
      const it=await g('PUT',at(file)+'/content',body,{'Content-Type':ct});
      const cur=await lget('meta',path);
      if(cur&&cur.v===m.v)await lput('meta',path,{dirty:false,etag:it.eTag,v:m.v});
      else await lput('meta',path,Object.assign({},cur,{etag:it.eTag}));
      if(path.startsWith('relatorios/'))await ldel('docs',path);
      await countPending();
    }
  }
  async function pull(c){
    let url=at(c)+'/children?$select=name,eTag&$top=500';const remote=new Map();
    while(url){const j=await g('GET',url);(j.value||[]).forEach(x=>{if(x.name.endsWith('.json'))remote.set(x.name.slice(0,-5),x.eTag)});url=j['@odata.nextLink']||null}
    let changed=false;
    for(const [id,etag] of remote){const path=c+'/'+id;const m=await lget('meta',path);if(m&&(m.dirty||m.etag===etag))continue;
      const r=await g('GET',at(c+'/'+id+'.json')+'/content',null,{},true);if(!r.ok)continue;
      let data;try{data=await r.json()}catch(e){continue}
      const loc=await lget('docs',path);const m2=await lget('meta',path);if(m2&&m2.dirty)continue;
      if(!loc||(data.atualizadoEm||'')>=(loc.atualizadoEm||'')){await lput('docs',path,data);changed=true}
      await lput('meta',path,{dirty:false,etag,v:(m2&&m2.v)||0})}
    for(const [path] of await lall('docs',c+'/')){const id=path.slice(c.length+1);if(remote.has(id))continue;const m=await lget('meta',path);
      if(m&&m.etag&&!m.dirty){await ldel('docs',path);await ldel('meta',path);changed=true}}
    if(changed)emit(c);
  }
  async function sync(){
    if(!CLOUD||!account)return;
    if(syncing){again=true;return}
    syncing=true;
    try{
      if(!navigator.onLine){ST.state='offline';await countPending();return}
      await root();await push();await pull('servicos');await pull('catalogo');
      ST.state='ok';ST.msg='';await countPending();
    }catch(e){
      if(e.login){ST.state='login'}
      else if(!navigator.onLine||e instanceof TypeError){ST.state='offline'}
      else{ST.state='error';ST.msg=e.message||'erro'}
      await countPending();
      if(e.retry)soon(e.retry*1000);
    }finally{syncing=false;if(again){again=false;soon(400)}}
  }
  window.PV_SYNC=sync;

  /* ---------- API usada pela aplicação (mesma forma do armazenamento do Claude) ---------- */
  async function setDoc(path,data){await lput('docs',path,clone(data));if(CLOUD){const m=await lget('meta',path)||{};await lput('meta',path,{dirty:true,etag:m.etag,v:(m.v||0)+1});countPending();soon()}emit(path.split('/')[0])}
  async function getDoc(path){let v=await lget('docs',path);
    if(v===undefined&&CLOUD&&path.startsWith('fotos/')&&navigator.onLine){try{await root();const r=await g('GET',at(fileOf(path))+'/content',null,{},true);if(r.ok){v={d:await blobToData(await r.blob())};await lput('docs',path,v);await lput('meta',path,{dirty:false,v:0})}}catch(e){}}
    return {exists:v!==undefined,data:()=>v===undefined?undefined:clone(v)}}
  async function delDoc(path){await ldel('docs',path);if(CLOUD){const m=await lget('meta',path)||{};if(m.etag||m.dirty)await lput('meta',path,{dirty:true,deleted:true,etag:m.etag,v:(m.v||0)+1});else await ldel('meta',path);countPending();soon()}emit(path.split('/')[0])}
  const docRef=path=>({id:path.split('/').pop(),path,set:d=>setDoc(path,d),update:async d=>{const c=(await getDoc(path)).data()||{};return setDoc(path,Object.assign(c,d))},get:()=>getDoc(path),delete:()=>delDoc(path)});
  const db={doc:docRef,collection:c=>({path:c,doc:id=>docRef(c+'/'+(id||Math.random().toString(36).slice(2))),onSnapshot(fn){(subs[c]=subs[c]||[]).push(fn);emit(c);soon(50);return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==fn)}}})};

  const downloads={save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data]);
    let msg='PDF descarregado para este dispositivo: '+filename+'.';
    if(CLOUD){await lput('docs','relatorios/'+filename,blob);const m=await lget('meta','relatorios/'+filename)||{};await lput('meta','relatorios/'+filename,{dirty:true,etag:m.etag,v:(m.v||0)+1});await countPending();
      await sync();const left=await lget('meta','relatorios/'+filename);
      msg=(left&&left.dirty)?'PDF descarregado. Fica na fila para a pasta Relatórios do OneDrive e segue quando houver ligação: '+filename+'.':'PDF guardado no OneDrive (pasta relatorios) e descarregado: '+filename+'.'}
    const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    return {status:'saved',msg}}};

  let ready=null;
  function boot(){return ready||(ready=(async()=>{await idb();await migrar();if(CLOUD){await auth();await countPending();
      setInterval(()=>{if(document.visibilityState==='visible')sync()},60000);
      addEventListener('online',()=>sync());addEventListener('offline',()=>{ST.state='offline';bar()});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
      sync()}
    return true})())}
  const user={me:async()=>{await boot();return {name:account?(account.name||account.username||''):''}},id:async()=>account?account.homeAccountId:null,isOwner:()=>false,canEdit:()=>true};
  window.claude={use:async n=>{
    if(n==='db'){await boot();return db}
    if(n==='downloads')return downloads;
    if(n==='user'){await boot();return user}
    return null}};
  window.PV_LOGOUT=()=>app&&app.logoutRedirect({account});
  window.PV_ACCOUNT=()=>account;
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();

/* Leitura local da etiqueta (OCR no próprio telemóvel, sem enviar a imagem para fora) */
(function(){
  let workerP=null;
  const loadLib=()=>window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('sem ligação para carregar o leitor de texto'));document.head.appendChild(s)});
  const getWorker=()=>workerP||(workerP=loadLib().then(()=>Tesseract.createWorker(['eng','por'])));
  const prep=blob=>new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>{const k=Math.max(1,Math.min(2.5,2200/Math.max(im.width,im.height)));const w=Math.round(im.width*k),h=Math.round(im.height*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];g=Math.max(0,Math.min(255,(g-128)*1.5+128));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);URL.revokeObjectURL(u);c.toBlob(res,'image/png')};im.onerror=()=>rej(new Error('imagem inválida'));im.src=u});
  const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
  function parse(text,catalogo){
    const T=text.replace(/\r/g,'');const lines=T.split('\n').map(l=>l.trim()).filter(Boolean);
    const pick=(re)=>{for(const l of lines){const m=l.match(re);if(m&&m[1])return m[1].replace(/[.,;:]+$/,'').trim()}return null};
    const r={modelo:null,codigo:null,numeroSerie:null,dataProducao:null,outros:null,catalogoId:null};
    // número de série: valor à frente (ou na linha seguinte) de Serial number / S/N / N.º de série
    const SN=/(?:SERIAL\s*(?:NUMBER|NUM\.?|NO\.?|N[º°O0]\.?|NR\.?|#)?|S\s*\/\s*N|\bSN\b|N[º°O0]?\.?\s*(?:DE\s*)?S[ÉE]RIE|N[º°]\s*S[ÉE]RIE|SERIENN?R\.?|SÉRIE|SERIE)/i;
    const VAL=/^[\s:.#\-–=]*((?=[A-Z0-9\-\/ ]*\d)[A-Z0-9][A-Z0-9\-\/]{3,}(?:\s[0-9]{2,}(?![A-Z0-9]))*)/i;
    for(let i=0;i<lines.length&&!r.numeroSerie;i++){const m=lines[i].match(SN);if(!m)continue;
      const rest=lines[i].slice(m.index+m[0].length);let v=rest.match(VAL);
      if(!v&&lines[i+1])v=lines[i+1].match(VAL);
      if(v)r.numeroSerie=v[1].replace(/\s+/g,'').replace(/[.,;:]+$/,'')}
    r.codigo=pick(/(?:C[ÓO]D(?:IGO)?|CODE|REF(?:ERENCE|ERÊNCIA|\.)?|ART(?:ICLE|\.)?|ARTIGO|P\/N|\bPN\b)\s*[:.#-]?\s*((?=[A-Z0-9\-.]*\d)[A-Z0-9][A-Z0-9\-.]{4,})/i);
    r.dataProducao=pick(/(?:DATE|DATA|FAB(?:RICO|\.)?|PROD(?:UCTION|UÇÃO|\.)?|MFG|MANUF\w*)[^0-9]{0,14}((?:W\s?\d{1,2}\s?[\/\-]\s?\d{2,4})|\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}|\d{1,2}[\/.\-]\d{4}|\d{4}[\/.\-]\d{1,2}(?:[\/.\-]\d{1,2})?)/i)
      ||(T.match(/\b(W\s?\d{1,2}\s?[\/\-]\s?\d{2,4})\b/i)||[])[1]||null;
    // modelo: primeiro pelo catálogo, depois pelas famílias, depois pela linha "Model/Modelo/Type"
    const NT=norm(T);
    let best=null;for(const c of catalogo||[]){const mc=c.codigo&&norm(c.codigo),mm=c.modelo&&norm(c.modelo);
      if(mc&&mc.length>=5&&NT.includes(mc)){best=c;break}
      if(mm&&mm.length>=4&&NT.includes(mm)&&(!best||norm(best.modelo||'').length<mm.length))best=c}
    if(best){r.catalogoId=best.id;r.modelo=best.modelo||null;if(!r.codigo&&best.codigo)r.codigo=best.codigo}
    if(!r.modelo){const m=T.match(/\b(SABIK|DOMEO|NASHIRA|ORKA)\b[\s\-]*([A-Z]{0,3}\s?\d{2,4}[A-Z0-9 \-]{0,8})?/i);if(m)r.modelo=(m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+(m[2]?' '+m[2].trim():'')).trim()}
    if(!r.modelo)r.modelo=pick(/(?:MODEL(?:O)?|TYPE|TIPO|MOD\.)\s*[:.#-]?\s*([A-Z0-9][A-Z0-9 \-\/]{2,24})/i);
    const ex=[];const add=re=>{const m=T.match(re);if(m)ex.push(m[0].replace(/\s+/g,' ').trim())};
    add(/\b\d{2,3}(?:\s*[-\/]\s*\d{2,3})?\s*V\b(?:\s*~)?/i);add(/\b\d{2}\s*Hz\b/i);add(/\b\d+(?:[.,]\d+)?\s*W\b/);add(/\b\d+(?:[.,]\d+)\s*A\b/);add(/\bIP\s?[X0-9]{2}\b/i);
    r.outros=ex.length?ex.join(' · '):null;
    return r}
  window.__ocrParse=parse;
  window.__ocr=async(blob,catalogo,onProg)=>{onProg&&onProg('a preparar o leitor (só demora na primeira vez)');const w=await getWorker();onProg&&onProg('a ler o texto da etiqueta');const img=await prep(blob);const {data}=await w.recognize(img);const r=parse(data.text||'',catalogo);r.texto=(data.text||'').trim();return r};
})();

<script>

function secoes(s,e){const it=(c,n,o={})=>Object.assign({c,k:keyOf(c),n},o);

  const fam=FAM[e.familia]||FAM.OUTRO;
  return [
    {code:'7.1',title:'Ponto de funcionamento',kind:'chk',items:F71.map(([c,n,v])=>it(c,n,Object.assign({states:['sim','nao','na']},v?{val:'Valor',num:1}:{})))},

    ...(fam.arr.length?[{code:'7.3',title:'Arranque · '+FAM_NOME[e.familia],kind:'chk',items:fam.arr.map(([c,n,r,no])=>it(c,n,{states:['ok','verf'],ref:r,note:no,val:'Especificação técnica / valor'}))}]:[]),
    ...(fam.opc.length?[{code:'7.4',title:'Opcional',kind:'chk',items:fam.opc.map(([c,n,r,no])=>it(c,n,{states:['sim','nao'],ref:r,note:no}))}]:[]),

}

const STANDALONE=()=>!!window.PV_MODE;
function setOut(kind,blob,nome,info){S.out={kind,nome,info,file:new File([blob],nome,{type:blob.type||'application/octet-stream'})}}
function outPanel(kind){const o=S.out;if(!o||o.kind!==kind)return '';let canShare=false;try{canShare=STANDALONE()&&!!(navigator.canShare&&navigator.canShare({files:[o.file]}))}catch(e){}
  return `<div class="outp"><div style="min-width:0"><b style="word-break:break-word">${esc(o.nome)}</b>${o.info?`<div class="muted" style="font-size:13px">${esc(o.info)}</div>`:''}</div><div class="row">${canShare?`<button class="pri" data-act="out-share">Partilhar</button>`:''}<button data-act="out-down" ${canShare?'':'class="pri"'}>Descarregar</button><button class="ghost sm" data-act="out-close">Fechar</button></div></div>`}
function nomeFich(t){return String(t||'').replace(/[\\/:*?"<>|]/g,'').trim()}
async function exportSvc(s){const fotos={};
  for(const e of s.equipamentos||[]){const all=[...(e.fotos||[]),...Object.values(e.ficha||{}).flatMap(d=>(d&&d.fotos)||[]),...(e.etiqueta?[e.etiqueta]:[])];
    for(const f of all){const d=await fotoData(f);if(d)fotos[f.id]=d}}
  const data={tipo:'pos-venda-sp-servico',versao:1,exportadoEm:new Date().toISOString(),servico:clean(s),fotos};
  setOut('svc',new Blob([JSON.stringify(data)],{type:'application/json'}),`${nomeFich(s.numero)} - ${nomeFich(s.cliente?.nome||'Cliente')}.posvenda.json`,'Ficheiro com o serviço completo, incluindo fotografias e assinaturas. Abre-se noutro telemóvel em Serviços › Importar ficheiro.')}
async function exportTudo(){const fotos={};
  for(const sv of S.servicos)for(const e of sv.equipamentos||[]){const all=[...(e.fotos||[]),...Object.values(e.ficha||{}).flatMap(d=>(d&&d.fotos)||[]),...(e.etiqueta?[e.etiqueta]:[])];
    for(const f of all){if(fotos[f.id])continue;const d=await fotoData(f);if(d)fotos[f.id]=d}}
  const data={tipo:'pos-venda-sp-tudo',versao:1,exportadoEm:new Date().toISOString(),servicos:clean(S.servicos),catalogo:clean(S.catalogo),fotos};
  const stamp=new Date().toISOString().slice(0,16).replace('T',' ').replace(':','h');
  setOut('tudo',new Blob([JSON.stringify(data)],{type:'application/json'}),`Pos-Venda S&P ${stamp}.posvenda.json`,`${S.servicos.length} serviço(s) e ${S.catalogo.length} equipamento(s) do catálogo, com fotografias e assinaturas. Abra este ficheiro no outro dispositivo em Serviços › Importar ficheiro.`)}
function exportCat(){const data={tipo:'pos-venda-sp-catalogo',versao:1,exportadoEm:new Date().toISOString(),itens:clean(S.catalogo)};
  setOut('cat',new Blob([JSON.stringify(data)],{type:'application/json'}),`Catalogo pecas S&P ${hoje()}.posvenda.json`,`${S.catalogo.length} equipamento(s). Nos outros telemóveis, abra em Equipamentos e peças › Importar.`)}
async function importar(file){let j;try{j=JSON.parse(await file.text())}catch(e){toast('O ficheiro não é um ficheiro do Pós-Venda.');return}
  if(j.tipo==='pos-venda-sp-catalogo'){let n=0;for(const c of j.itens||[]){if(!c.id)continue;const {id,...d}=c;await S.db.doc('catalogo/'+id).set(d);n++}toast(n+' equipamento(s) do catálogo importado(s).');setTimeout(()=>toast(''),4000);return}
  const fix=f=>{if(f&&j.fotos&&j.fotos[f.id]){f.src='db'}return f};
  const upSvc=async sv=>{const ex=S.servicos.find(x=>x.id===sv.id);if(ex&&(ex.atualizadoEm||'')>(sv.atualizadoEm||''))return false;
    for(const e of sv.equipamentos||[]){(e.fotos||[]).forEach(fix);Object.values(e.ficha||{}).forEach(d=>(d&&d.fotos||[]).forEach(fix));if(e.etiqueta)fix(e.etiqueta)}
    const ids=new Set();for(const e of sv.equipamentos||[]){[...(e.fotos||[]),...Object.values(e.ficha||{}).flatMap(d=>(d&&d.fotos)||[]),...(e.etiqueta?[e.etiqueta]:[])].forEach(f=>f&&ids.add(f.id))}
    for(const id of ids){const d=j.fotos&&j.fotos[id];if(d){await S.db.doc('fotos/'+id).set({d,sid:sv.id});S.fotoCache[id]=d}}
    const {id,...data}=sv;await S.db.doc('servicos/'+id).set(data);return true};
  if(j.tipo==='pos-venda-sp-tudo'){let n=0,k=0,c=0;for(const sv of j.servicos||[]){if(!sv.id)continue;if(await upSvc(sv))n++;else k++}
    for(const it of j.catalogo||[]){if(!it.id)continue;const {id,...d}=it;await S.db.doc('catalogo/'+id).set(d);c++}
    toast(`Importado: ${n} serviço(s) e ${c} equipamento(s) do catálogo.${k?` ${k} serviço(s) mantido(s), porque neste dispositivo estão mais recentes.`:''}`);setTimeout(()=>toast(''),6000);return}
  if(j.tipo==='pos-venda-sp-servico'&&j.servico&&j.servico.id){const sv=j.servico;
    if(!await upSvc(sv)){toast('Este dispositivo já tem uma versão mais recente de '+(sv.numero||'este serviço')+'. Nada foi alterado.');setTimeout(()=>toast(''),5000);return}
    toast('Serviço '+(sv.numero||'')+' importado.');setTimeout(()=>toast(''),4000);return}
  toast('O ficheiro não é um ficheiro do Pós-Venda.')}

const keyOf=c=>'c'+c.replace(/\./g,'_');

const fmtD=d=>{if(!d)return'';const p=String(d).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d};
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function setP(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k]});a[ks[ks.length-1]]=v}
const cur=()=>S.servicos.find(s=>s.id===S.sid);
const curEq=()=>{const s=cur();return s&&(s.equipamentos||[]).find(e=>e.uid===S.eqUid)};
const curCat=()=>S.catalogo.find(c=>c.id===S.cid);
const findEq=(sid,u)=>{const s=S.servicos.find(x=>x.id===sid);return s&&(s.equipamentos||[]).find(x=>x.uid===u)};
const catOf=e=>e&&e.catalogoId?S.catalogo.find(c=>c.id===e.catalogoId):null;
const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith('_')?undefined:v));

/* ================== GRAVAÇÃO ================== */
const W={};
function wq(key,path,getObj,delay){const w=W[key]=W[key]||{};S.dirty[key]=true;clearTimeout(w.timer);w.timer=setTimeout(()=>wrun(key,path,getObj),delay);setSaveState('a gravar…')}
async function wrun(key,path,getObj){const w=W[key];if(w.inflight){w.pending=true;return}
  const o=getObj();if(!o){S.dirty[key]=false;return}
  w.inflight=true;w.pending=false;o.atualizadoEm=new Date().toISOString();
  try{const {id:_,...data}=clean(o);await S.db.doc(path).set(data);w.fail=0;setSaveState('gravado');toast('')}
  catch(e){w.pending=true;w.fail=(w.fail||0)+1;setSaveState('por gravar');toast('As últimas alterações ainda não foram gravadas ('+(e.code||e.message||'erro')+'). Nova tentativa automática dentro de segundos.')}
  finally{w.inflight=false;if(w.pending&&getObj()){w.timer=setTimeout(()=>wrun(key,path,getObj),w.fail?Math.min(10000,1500*w.fail):30)}else{S.dirty[key]=false}}}
function wstop(key){const w=W[key];if(w){clearTimeout(w.timer);w.pending=false}S.dirty[key]=false}
function saveSvc(now,sid){const id=sid||S.sid;if(!S.db||!S.servicos.find(x=>x.id===id))return;wq(id,'servicos/'+id,()=>S.servicos.find(x=>x.id===id),now?0:700)}
function saveCat(){const c=curCat();if(!c||!S.db)return;const id=c.id;wq('cat_'+id,'catalogo/'+id,()=>S.catalogo.find(x=>x.id===id),600)}
function toast(t){const el=$('#toast');if(!el)return;el.textContent=t;el.hidden=!t}
function setSaveState(t){const el=$('#savest');if(el)el.textContent=t}
function onFocusInput(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}

/* ================== ARRANQUE ================== */
(async function init(){
  try{S.db=await claude.use('db')}catch(e){}
  try{S.user=await claude.use('user')}catch(e){}
  try{S.assets=await claude.use('assets')}catch(e){}
  try{S.sample=await claude.use('sample')}catch(e){}
  try{S.downloads=await claude.use('downloads')}catch(e){}
  if(S.user){try{const me=await S.user.me();S.meName=me&&me.name||''}catch(e){}}
  if(!S.db){S.noDb=true;S.ready=true;render();return}
  const keep=(local,remote,dk)=>{const ids=new Set(remote.map(r=>r.id));
    const merged=remote.map(n=>{const o=local.find(x=>x.id===n.id);return (o&&(S.dirty[dk(n.id)]||(n.id===S.sid&&onFocusInput())||(o.atualizadoEm&&n.atualizadoEm&&o.atualizadoEm>=n.atualizadoEm)))?o:n});
    local.filter(o=>!ids.has(o.id)&&S.dirty[dk(o.id)]).forEach(o=>merged.push(o));return merged};
  S.db.collection('servicos').onSnapshot(snap=>{
    S.servicos=keep(S.servicos,snap.docs.map(d=>({id:d.id,...d.data()})),id=>id);
    S.ready=true;if(!onFocusInput())render()},()=>{S.ready=true;render()});
  S.db.collection('catalogo').onSnapshot(snap=>{
    S.catalogo=keep(S.catalogo,snap.docs.map(d=>({id:d.id,...d.data()})),id=>'cat_'+id).sort((a,b)=>(a.modelo||'').localeCompare(b.modelo||''));
    if(!onFocusInput())render()});
})();

/* ================== NAVEGAÇÃO ================== */
function go(view,opts={}){Object.assign(S,{view},opts);S.confirm=null;S.out=null;render();window.scrollTo(0,0)}

function render(){
  const app=$('#app'),hdr=$('#hdr'),bar=$('#bar'),barin=$('#barin');
  bar.hidden=true;barin.innerHTML='';
  if(!S.ready){return}
  if(S.noDb){hdr.innerHTML=LOGO_IMG+`<div class="brand">Pós-Venda S&amp;P</div>`;app.innerHTML=`<div class="notice">A base de dados não está disponível nesta vista. Abra a ferramenta em claude.ai com sessão iniciada para registar serviços.</div>`;return}
  const v=S.view;
  const setHdr=h=>{hdr.innerHTML=LOGO_IMG+h};
  const hero=$('#hero');hero.hidden=true;
  if(v==='lista'||v==='catalogo'){
    setHdr(`<div class="brand">S&amp;P Portugal<small>Serviço de Assistência Técnica</small></div>`);
    if(v==='lista'){hero.hidden=false;hero.innerHTML=ARCS+vHero()}
    app.innerHTML=`<div class="stack"><div class="tabs"><button data-act="tab-main" data-v="lista" class="${v==='lista'?'on':''}">Serviços</button><button data-act="tab-main" data-v="catalogo" class="${v==='catalogo'?'on':''}">Equipamentos e peças</button></div>${v==='lista'?vLista():vCatalogo()}</div>`;
    if(v==='catalogo'){bar.hidden=false;barin.innerHTML=`<button class="pri" data-act="cat-novo">+ Novo equipamento</button>`}
  }else if(v==='servico'){const s=cur();if(!s){go('lista');return}
    setHdr(`<button class="ghost" data-act="back-lista" aria-label="Voltar">‹ Serviços</button><div class="brand">${esc(s.numero)}<small>${s.tipo==='COM'?'Comissionamento':'Assistência técnica'} · <span id="savest">gravado</span></small></div>`);
    app.innerHTML=vServico(s);afterRender();
  }else if(v==='equip'){const s=cur(),e=curEq();if(!e){go('servico');return}
    setHdr(`<button class="ghost" data-act="back-serv" aria-label="Voltar">‹ ${esc(s.numero)}</button><div class="brand">${esc(e.modelo||'Equipamento')}<small>${esc([e.ref&&e.ref.trim()?'Ref. '+e.ref.trim():'',e.nserie?'N.º série '+e.nserie:'Sem n.º de série'].filter(Boolean).join(' · '))} · <span id="savest">gravado</span></small></div>`);
    app.innerHTML=vEquip(s,e);afterRender();
  }else if(v==='cat-edit'){const c=curCat();if(!c){go('catalogo');return}
    setHdr(`<button class="ghost" data-act="tab-main" data-v="catalogo">‹ Equipamentos</button><div class="brand">${esc(c.modelo||'Novo equipamento')}<small><span id="savest">gravado</span></small></div>`);
    app.innerHTML=vCatEdit(c);
  }
}

function vHero(){const h=new Date().getHours();const saud=h<13?'Bom dia':h<20?'Boa tarde':'Boa noite';
  const abertos=S.servicos.filter(s=>s.estado!=='concluido').length;
  const lim=new Date(Date.now()-30*864e5).toISOString();
  const conc=S.servicos.filter(s=>s.estado==='concluido'&&(s.concluidoEm||'')>=lim).length;
  const eqs=S.servicos.filter(s=>(s.criadoEm||'')>=lim).reduce((n,s)=>n+(s.equipamentos||[]).length,0);
  const nome=(S.meName||'').split(' ')[0];
  return `<div class="in"><div><div class="eyebrow">${saud}${nome?', '+esc(nome):''}${window.PV_MODE==='cloud'&&window.PV_LOGOUT?` · <button type="button" class="sm ghost" style="padding:0;min-height:0;font-size:12px;letter-spacing:1.4px" data-act="sair">SAIR</button>`:''}</div><h1>Pós-Venda</h1></div>
  ${window.PV_MODE==='local'?'<div class="muted" style="font-size:13.5px">Os serviços ficam guardados neste dispositivo. No fim, partilhe o relatório e exporte o serviço para o escritório.</div>':''}
  <div class="stats"><div class="stat"><b>${abertos}</b><span>Em curso</span></div><div class="stat"><b>${conc}</b><span>Concluídos em 30 dias</span></div><div class="stat"><b>${eqs}</b><span>Equipamentos em 30 dias</span></div></div>
  ${S.pick?`<div class="pickf"><div class="lbl">${S.pick==='COM'?'Novo comissionamento':'Nova assistência técnica'} · escolha a ficha</div><div class="actions">${Object.entries(FICHAS).map(([k,o])=>`<button class="tile" data-act="novo-ficha" data-v="${k}"><span class="ic ${k==='nashira'?'com':'eq'}">${IC.com}</span><span><b>${esc(o.nome)}</b><small>${esc(o.desc)}</small></span></button>`).join('')}</div><div><button class="sm ghost" data-act="novo-cancel">Cancelar</button></div></div>`:`<div class="actions"><button class="tile" data-act="novo" data-v="AT"><span class="ic at">${IC.at}</span><span><b>Assistência técnica</b><small>Avaria, diagnóstico, troca de peças</small></span></button>
  <button class="tile" data-act="novo" data-v="COM"><span class="ic com">${IC.com}</span><span><b>Comissionamento</b><small>Arranque e verificação da instalação</small></span></button></div>`}</div>`}
function vLista(){
  let arr=[...S.servicos].sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  if(S.filtro==='abertos')arr=arr.filter(s=>s.estado!=='concluido');
  if(S.filtro==='concluidos')arr=arr.filter(s=>s.estado==='concluido');
  const q=S.q.trim().toLowerCase();
  if(q)arr=arr.filter(s=>[s.numero,s.cliente?.nome,s.local?.obra,s.local?.localidade,s.instalador?.nome,s.notaInterna,...(s.equipamentos||[]).flatMap(e=>[e.modelo,e.nserie,e.ref])].join(' ').toLowerCase().includes(q));
  const f=(k,t)=>`<button data-act="filtro" data-v="${k}" class="${S.filtro===k?'on':''}">${t}</button>`;
  return `<div class="search">${IC.search}<input id="q" placeholder="Procurar cliente, obra, n.º ou modelo" value="${esc(S.q)}" data-act-input="q" aria-label="Procurar"></div>
  <div class="tabs under">${f('abertos','Em curso')}${f('concluidos','Concluídos')}${f('todos','Todos')}</div>
  ${arr.length?`<div class="list">${arr.map(cardSvc).join('')}</div>`:`<div class="empty"><b>${S.servicos.length?'Nenhum serviço neste filtro':'Ainda não há serviços registados'}</b><span>Abra uma assistência técnica ou um comissionamento no topo da página.</span></div>`}
  <div class="panel sect"><div class="sect-h"><h3>Passar para outro dispositivo</h3></div>
   <div class="muted" style="font-size:13.5px">Cada dispositivo guarda os seus dados. Para continuar no computador, exporte aqui e importe lá o mesmo ficheiro. Para voltar ao telemóvel, faça o inverso. Fica sempre a versão mais recente de cada serviço.</div>
   <div class="row"><button class="sm" data-act="exp-tudo" ${S.servicos.length||S.catalogo.length?'':'disabled'} ${S.busy.expT?'disabled':''}>${S.busy.expT?'<span class="spin"></span> A preparar…':'Exportar tudo'}</button><span class="filebtn"><button type="button" class="sm">Importar ficheiro</button><input type="file" accept=".json,application/json" data-file="importar" aria-label="Importar ficheiro"></span></div>
   ${outPanel('tudo')}</div>`;

function novoServico(tipo,ficha){
  const ano=new Date().getFullYear();const pref=(tipo==='COM'?'COM':'AT')+'-'+ano+'-';
  const max=S.servicos.filter(s=>(s.numero||'').startsWith(pref)).map(s=>parseInt(s.numero.slice(pref.length))||0).reduce((a,b)=>Math.max(a,b),0);
  const s={id:uid(),tipo,numero:pref+String(max+1).padStart(3,'0'),estado:'aberto',criadoEm:new Date().toISOString(),data:hoje(),
    assunto:tipo==='COM'?'Comissionamento':'Assistência técnica',tecnico:S.meName||'',cliente:{},local:{},instalador:{},
    avaria:'',analise:'',recomendacoes:'',garantia:'',observacoes:'',equipamentos:[],assin:{},ficha:ficha==='nashira'?'nashira':'geral'};
  S.servicos.unshift(s);S.sid=s.id;S.svTab='dados';saveSvc();go('servico');

function fld(label,key,o={}){const [p,path]=key.split(':');const base=p==='s'?cur():p==='e'?curEq():curCat();const val=getP(base,path)??'';const id='f_'+key.replace(/[^a-z0-9]/gi,'_');
  if(o.area)return `<label class="f" for="${id}"><span>${label}</span><textarea id="${id}" data-b="${key}" placeholder="${esc(o.ph||'')}">${esc(val)}</textarea></label>`;
  if(o.sel)return `<label class="f" for="${id}"><span>${label}</span><select id="${id}" data-b="${key}">${o.sel.map(([v,t])=>`<option value="${v}" ${v===val?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
  return `<label class="f" for="${id}"><span>${label}</span><input id="${id}" data-b="${key}" type="${o.type||'text'}" inputmode="${o.im||'text'}" value="${esc(val)}" placeholder="${esc(o.ph||'')}"></label>`}
function seg(key,opts){const [p,path]=key.split(':');const base=p==='s'?cur():curEq();const val=getP(base,path)||'';
  return `<div class="seg" data-key="${key}">${opts.map(o=>`<button type="button" data-act="seg" data-v="${o}" class="${val===o?'on':''}">${ST[o]}</button>`).join('')}</div>`}

function vServico(s){
  const t=(k,n)=>`<button data-act="svtab" data-v="${k}" class="${S.svTab===k?'on':''}">${n}</button>`;
  let body='';
  if(S.svTab==='dados')body=`
   <div class="panel sect"><div class="sect-h"><span class="code">1–3</span><h3>Serviço e cliente</h3></div>
    <div class="grid2">${fld('N/ Ref.ª','s:numero')}${fld('Data da intervenção','s:data',{type:'date'})}</div>
    ${fld('Ficha de verificação','s:ficha',{sel:Object.entries(FICHAS).map(([k,o])=>[k,o.nome])})}
    ${fld('Assunto','s:assunto')}
    ${fld('Cliente','s:cliente.nome',{ph:'Nome do cliente'})}
    <div class="grid2">${fld('Contacto','s:cliente.contacto',{type:'tel',im:'tel'})}${fld('E-mail','s:cliente.email',{type:'email',im:'email'})}</div>
    ${fld('Técnico responsável','s:tecnico',{ph:'Nome do(s) técnico(s)'})}</div>
   <div class="panel sect"><div class="sect-h"><span class="code">6</span><h3>Obra / local de instalação</h3></div>
    ${fld('Obra','s:local.obra',{ph:'Designação da obra'})}${fld('Morada','s:local.morada')}${fld('Localidade','s:local.localidade')}</div>
   <div class="panel sect"><div class="sect-h"><span class="code">5</span><h3>Instalador</h3></div>
    <div class="grid2">${fld('Instalador','s:instalador.nome')}${fld('Localidade','s:instalador.localidade')}</div>
    <div class="grid2">${fld('Responsável','s:instalador.responsavel')}${fld('Contacto','s:instalador.contacto',{type:'tel',im:'tel'})}</div>
    ${fld('E-mail','s:instalador.email',{type:'email',im:'email'})}</div>
   ${s.tipo==='AT'?`<div class="panel sect"><div class="sect-h"><h3>Descrição da avaria</h3></div>${fld('Avaria reportada pelo cliente','s:avaria',{area:1})}</div>`:''}
   <div class="panel sect interna"><div class="sect-h"><span class="lock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><h3>Notas internas do serviço</h3></div><div class="muted" style="font-size:13px">Só para a S&amp;P. Não aparecem no relatório do cliente.</div>${fld('Notas internas','s:notaInterna',{area:1,ph:'Ex.: cliente difícil de contactar; voltar a verificar o by-pass na próxima visita'})}</div>
   <div class="panel sect"><div class="sect-h"><h3>Zona de perigo</h3></div>${S.confirm==='del-svc'?`<div class="confirm"><span>Apagar ${esc(s.numero)} e todos os dados?</span><button class="danger sm" data-act="del-svc-ok">Apagar</button><button class="sm" data-act="cancel">Cancelar</button></div>`:`<div><button class="danger sm" data-act="ask" data-v="del-svc">Apagar serviço</button></div>`}</div>`;
  if(S.svTab==='equip'){const eq=s.equipamentos||[];
    body=`${eq.length?`<div class="list">${eq.map((e,i)=>{const pr=progFicha(s,e);return card({act:'abrir-eq',v:e.uid,ic:'eq',top:`<b>Equip. ${i+1}</b>${e.ref&&e.ref.trim()?`<span class="pill ref">Ref. ${esc(e.ref.trim())}</span>`:''}${e.familia&&fichaDe(s)!=='nashira'?`<span class="pill">${esc(FAM_NOME[e.familia])}</span>`:''}`,title:esc(e.modelo||'Modelo por identificar'),sub:`<span class="mono">${esc([e.codigo,e.nserie&&'S/N '+e.nserie].filter(Boolean).join(' · ')||'—')}</span>`,meta:`<span>Ficha ${pr}%</span><span>${(e.fotos||[]).length} fotos</span><span>${(e.acoes||[]).length} ações</span>`,extra:`<span class="prog"><i style="width:${pr}%"></i></span>`})}).join('')}</div>`:`<div class="empty"><b>Sem equipamentos neste serviço</b><span>Adicione o primeiro e comece pela fotografia da etiqueta.</span></div>`}
    <div class="panel sect"><div class="sect-h"><h3>Adicionar equipamento</h3></div>
     <div class="actions"><span class="filebtn" style="display:flex"><button class="tile" type="button" style="width:100%"><span class="ic at">${IC.cam}</span><span><b>Pela etiqueta</b><small>Fotografar e ler os dados</small></span></button><input type="file" accept="image/*" capture="environment" data-file="novo-etiqueta" aria-label="Fotografar etiqueta do novo equipamento"></span>
     <button class="tile" data-act="add-eq-manual"><span class="ic eq">${IC.eq}</span><span><b>Manualmente</b><small>Escolher do catálogo ou escrever os dados</small></span></button></div></div>`}
  if(S.svTab==='rel')body=vRelatorio(s);
  return `<div class="stack"><div class="tabs under sticky-sub">${t('dados','Cliente e obra')}${t('equip','Equipamentos ('+(s.equipamentos||[]).length+')')}${t('rel','Relatório')}</div>${body}</div>`;
}
function progFicha(s,e){const f=e.ficha||{};const items=secoes(s,e).filter(x=>x.kind==='chk').flatMap(x=>x.items);if(!items.length)return 0;const oc=new Set(e.ocultos||[]);const vis=items.filter(x=>!oc.has(x.k));if(!vis.length)return 100;const n=vis.filter(x=>f[x.k]?.e||(!x.states&&f[x.k]?.v)).length;return Math.round(n/vis.length*100)}

function addEq(modo,noGo){const s=cur();const e={uid:uid(),modo:modo||'manual',catalogoId:'',familia:'',modelo:'',codigo:'',nserie:'',dataProducao:'',refFatura:'',dataFatura:'',ref:'',etiqueta:null,etiquetaDados:null,ficha:{},fotos:[],acoes:[]};
  (s.equipamentos=s.equipamentos||[]).push(e);S.eqUid=e.uid;S.eqTab='id';saveSvc(true);if(noGo){S.view='equip';S.confirm=null;window.scrollTo(0,0)}else go('equip');return e}

/* ================== EQUIPAMENTO NO SERVIÇO ================== */
function vEquip(s,e){
  const t=(k,n)=>`<button data-act="eqtab" data-v="${k}" class="${S.eqTab===k?'on':''}">${n}</button>`;
  let body='';
  if(S.eqTab==='id')body=vIdent(s,e);
  if(S.eqTab==='ficha')body=vFicha(s,e);
  if(S.eqTab==='fotos')body=vFotos(e);
  if(S.eqTab==='acoes')body=vAcoes(e);
  return `<div class="stack"><div class="tabs under sticky-sub">${t('id','Identificação')}${t('ficha','Ficha')}${t('fotos','Fotos ('+(e.fotos||[]).length+')')}${t('acoes','Ações ('+(e.acoes||[]).length+')')}</div>${body}</div>`;
}
function fotoSrc(f){if(!f)return'';if(f.src==='asset')return '/_blob/'+f.id;return S.fotoCache[f.id]||''}
function loadDbFotos(list){list.filter(f=>f&&f.src==='db'&&!S.fotoCache[f.id]).forEach(async f=>{try{const d=await S.db.doc('fotos/'+f.id).get();if(d.exists){S.fotoCache[f.id]=d.data().d;document.querySelectorAll(`img[data-fid="${f.id}"]`).forEach(i=>i.src=S.fotoCache[f.id])}}catch(e){}})}
function vIdent(s,e){
  const opts=[['','— Escolher do catálogo —'],...S.catalogo.map(c=>[c.id,(c.modelo||'?')+(c.codigo?' · '+c.codigo:'')])];
  const famSel=[['','— Escolher —'],...Object.keys(FAM).map(k=>[k,FAM_NOME[k]])];
  const ia=S.busy['ia_'+e.uid];const msg=S.msg['ia_'+e.uid]||'';
  if(e.etiqueta)loadDbFotos([e.etiqueta]);
  const dados=e.etiquetaDados;
  const manual=e.modo==='manual'&&!e.etiqueta;
  const pEtq=`<div class="panel sect"><div class="sect-h"><span class="code">4</span><h3>Etiqueta do equipamento${manual?' <span class="muted" style="font-weight:500;font-size:14px">· opcional</span>':''}</h3></div>
   <div class="label-shot"><div class="img">${e.etiqueta?`<img data-fid="${e.etiqueta.id}" src="${esc(fotoSrc(e.etiqueta))}" alt="Etiqueta">`:'<span class="muted" style="font-size:13px">Sem fotografia</span>'}</div>
   <div class="stack" style="gap:8px">
    <span class="filebtn"><button class="pri" type="button">${e.etiqueta?'Repetir fotografia':'Fotografar etiqueta'}</button><input type="file" accept="image/*" capture="environment" data-file="etiqueta" aria-label="Fotografar etiqueta"></span>
    ${(S.sample||window.__ocr)?`<button data-act="ia-ler" ${!e.etiqueta||ia?'disabled':''}>${ia?'<span class="spin"></span> '+esc(S.msg['iap_'+e.uid]||'A ler a etiqueta…'):'Ler dados da etiqueta'}</button>`:'<span class="muted" style="font-size:13px">A leitura automática da etiqueta não está disponível nesta vista. Preencha os campos à mão.</span>'}
    ${msg?`<span class="${msg.startsWith('!')?'err-msg':'ok-msg'}" style="font-size:13px">${esc(msg.replace(/^!/,''))}</span>`:''}
   </div></div>
   ${dados&&dados.outros?`<div class="muted" style="font-size:13px">Outros dados lidos: ${esc(dados.outros)}</div>`:''}
   ${dados&&dados.texto?`<details><summary class="muted" style="font-size:13px;cursor:pointer">Texto lido na etiqueta</summary><pre style="white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;margin:6px 0 0;user-select:text">${esc(dados.texto)}</pre></details>`:''}
  </div>`;
  const pDados=`<div class="panel sect"><div class="sect-h"><h3>Dados do equipamento</h3></div>
   ${fld('Equipamento do catálogo','e:catalogoId',{sel:opts})}
   <div class="grid2">${fld('Modelo','e:modelo',{ph:'Ex.: Nashira S200'})}${fld('Família (define a ficha)','e:familia',{sel:famSel})}</div>
   <div class="grid2">${fld('Código','e:codigo')}${fld('N.º de série','e:nserie')}</div>
   <div class="grid2">${fld('Data de produção','e:dataProducao',{ph:'Como consta na etiqueta'})}${fld('Referência interna','e:ref',{ph:'Opcional'})}</div>
   <div class="grid2">${fld('Ref.ª da fatura','e:refFatura')}${fld('Data da fatura','e:dataFatura',{type:'date'})}</div>
  </div>`;
  const pInt=`<div class="panel sect interna"><div class="sect-h"><span class="lock"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><h3>Notas internas do equipamento</h3></div><div class="muted" style="font-size:13px">Só para a S&amp;P. Não aparecem no relatório do cliente.</div>${fld('Notas internas','e:notaInterna',{area:1,ph:'Ex.: peça encomendada; instalação fora das recomendações, falar com o instalador'})}</div>`;
  return (manual?pDados+pEtq:pEtq+pDados)+pInt+`<div class="panel sect"><div class="sect-h"><h3>Remover</h3></div>${S.confirm==='del-eq'?`<div class="confirm"><span>Remover este equipamento do serviço?</span><button class="danger sm" data-act="del-eq-ok">Remover</button><button class="sm" data-act="cancel">Cancelar</button></div>`:`<div><button class="danger sm" data-act="ask" data-v="del-eq">Remover equipamento</button></div>`}</div>`;
}
function ptName(e,k){const f=e.ficha||{};
  for(const sc of secoes(cur(),e))for(const x of (sc.items||[]))if(x.k===k)return x.c+' · '+x.n;
  const m=k.match(/^c7_5_(1|2)_(\d+)$/);if(m){const lista=m[1]==='1'?EXT:INS;const i=+m[2]-1;const nome=lista[i]||(f[k]?.n)||'Outros';return '7.5.'+m[1]+'.'+m[2]+' · '+(m[1]==='1'?'Extração':'Insuflação')+' · '+nome}
  return k}
function ptExtra(e,k,code,force){const d=(e.ficha||{})[k]||{};const fotos=d.fotos||[];const open=force||S.open[e.uid+k]||d.c||fotos.length;const up=S.busy['pt_'+e.uid+k];
  if(fotos.length)loadDbFotos(fotos);
  return `<div class="ptx"><div class="ptb">
   <button type="button" class="sm ghost" data-act="pt-nota" data-v="${k}">${d.c||S.open[e.uid+k]?'Comentário':'+ Comentário'}</button>
   <span class="filebtn"><button type="button" class="sm ghost">${up?'<span class="spin"></span> A carregar':'+ Foto'}${fotos.length?' ('+fotos.length+')':''}</button><input type="file" accept="image/*" capture="environment" multiple data-file="ponto" data-k="${k}" aria-label="Fotografia do ponto ${esc(code)}"></span>
   <button type="button" class="sm ghost hide-b" data-act="pt-ocultar" data-v="${k}">Ocultar</button></div>
   ${open&&(d.c!==undefined||S.open[e.uid+k])?`<textarea data-b="e:ficha.${k}.c" id="f_${e.uid}_${k}_c" placeholder="Comentário sobre este ponto" style="min-height:64px">${esc(d.c||'')}</textarea>`:''}
   ${fotos.length?`<div class="pthumbs">${fotos.map(ph=>`<div class="pth"><img data-fid="${ph.id}" src="${esc(fotoSrc(ph))}" alt="Fotografia do ponto ${esc(code)}">${S.confirm==='del-pf-'+ph.id?`<button class="danger sm" data-act="pt-foto-del" data-k="${k}" data-v="${ph.id}">Apagar</button>`:`<button class="sm x" data-act="ask" data-v="del-pf-${ph.id}" aria-label="Apagar fotografia">✕</button>`}</div>`).join('')}</div>`:''}
  </div>`}
function hiddenBar(e,keys){const oc=new Set(e.ocultos||[]);const h=keys.filter(k=>oc.has(k));if(!h.length)return'';
  return `<div class="hidbar"><span class="muted">${h.length} ponto${h.length>1?'s':''} oculto${h.length>1?'s':''}:</span>${h.map(k=>`<button class="sm" data-act="pt-repor" data-v="${k}" title="Mostrar de novo">${esc(ptName(e,k).split(' · ')[0])} ↺</button>`).join('')}</div>`}
function vFicha(s,e){
  const f=e.ficha||{};const oc=new Set(e.ocultos||[]);const nash=fichaDe(s)==='nashira';
  if(!nash&&!e.familia)return `<div class="notice">Escolha a família do equipamento em Identificação para carregar a ficha correta (Sabik, Domeo, Nashira, Orka). Para a ficha Nashira, mude a ficha do serviço em Cliente e obra.</div>`;
  const row=x=>{const k=x.k;if(oc.has(k))return '';const lid='dl_'+k;return `<div class="chk"><div class="c">${x.c}</div><div class="body"><div>${esc(x.n)}</div>${x.ref?`<div class="ref">Ref. manual <b>${esc(x.ref)}</b></div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}
    <div class="row">${x.states?seg('e:ficha.'+k+'.e',x.states):''}${x.val?`<input style="flex:1;min-width:120px" data-b="e:ficha.${k}.v" id="f_${e.uid}_${k}" value="${esc(f[k]?.v||'')}" placeholder="${esc(x.val)}" ${x.num?'inputmode="decimal"':''} ${x.sug?`list="${lid}"`:''}>${x.sug?`<datalist id="${lid}">${x.sug.map(o=>`<option value="${esc(o)}"></option>`).join('')}</datalist>`:''}`:''}</div>${ptExtra(e,k,x.c)}</div></div>`};
  const sec=sc=>{const keys=sc.items.map(x=>x.k);const vis=keys.filter(k=>!oc.has(k)).length;
    return `<div class="panel sect"><div class="sect-h"><span class="code">${sc.code}</span><h3>${esc(sc.title)}</h3><span class="muted" style="margin-left:auto;font-size:12.5px">${vis}/${keys.length}</span></div>${sc.items.map(row).join('')}${vis?'':'<div class="muted" style="font-size:13px">Todos os pontos desta secção estão ocultos.</div>'}${sc.foot?`<div class="muted" style="font-size:12px">${esc(sc.foot)}</div>`:''}${hiddenBar(e,keys)}</div>`};
  const intro=`<div class="muted" style="font-size:13px"><b style="color:var(--ink)">${esc(FICHAS[fichaDe(s)].nome)}.</b> ${s.tipo==='AT'?'Em assistência técnica a ficha é opcional. ':''}Use "Ocultar" nos pontos que não se aplicam. Comentários e fotografias de cada ponto aparecem no relatório logo a seguir a esse ponto.</div>`;
  const caud=(titulo,cod,lista)=>{const rows=[...lista.map((n,i)=>[cod+'.'+(i+1),n,false]),...Array.from({length:N_OUTROS},(_,j)=>[cod+'.'+(lista.length+j+1),'',true])];
    const vis=rows.filter(([c])=>!oc.has(keyOf(c)));
    return `<h3 style="font-size:15px;margin-top:6px">${titulo}</h3><div class="tbl-wrap"><table class="caud"><thead><tr><th></th><th>Compartimento</th><th>Proj.</th><th>Real</th><th></th><th></th></tr></thead><tbody>${vis.map(([c,n,o])=>{const k=keyOf(c);const d=f[k]||{};const dv=desvio(d.p,d.r);const has=d.c!==undefined||(d.fotos||[]).length||S.open[e.uid+k+'_row'];
     return `<tr><td class="c">${c}</td><td>${o?`<input data-b="e:ficha.${k}.n" id="f_${e.uid}_${k}_n" value="${esc(d.n||'')}" placeholder="Outros">`:esc(n)}</td><td><input data-b="e:ficha.${k}.p" id="f_${e.uid}_${k}_p" inputmode="decimal" value="${esc(d.p||'')}"></td><td><input data-b="e:ficha.${k}.r" id="f_${e.uid}_${k}_r" inputmode="decimal" value="${esc(d.r||'')}"></td><td class="d" data-dv="${k}">${dv}</td><td class="m"><button type="button" class="sm ghost" data-act="pt-row" data-v="${k}" aria-label="Comentário, fotografia ou ocultar" title="Comentário, fotografia ou ocultar">${(d.fotos||[]).length||d.c?'●':'⋯'}</button></td></tr>${has?`<tr class="ptrow"><td></td><td colspan="5">${ptExtra(e,k,c,true)}</td></tr>`:''}`}).join('')}</tbody></table></div>${hiddenBar(e,rows.map(([c])=>keyOf(c)))}`};
  return intro+secoes(s,e).map(sc=>sc.kind==='caud'?`<div class="panel sect"><div class="sect-h"><span class="code">7.5</span><h3>Caudal por ponto (m³/h)</h3></div>${caud('Extração','7.5.1',EXT)}${caud('Insuflação','7.5.2',INS)}</div>`:sec(sc)).join('');
}
function desvio(p,r){const P=parseFloat(String(p).replace(',','.')),R=parseFloat(String(r).replace(',','.'));if(!P||isNaN(R))return'';const d=(R-P)/P*100;return (d>0?'+':'')+d.toFixed(0)+'%'}

function vFotos(e){const fs=e.fotos||[];loadDbFotos(fs);const up=S.busy['up_'+e.uid];
  return `<div class="row"><span class="filebtn"><button class="pri" type="button">${up?'<span class="spin"></span> A carregar…':'Tirar / anexar fotografias'}</button><input type="file" accept="image/*" capture="environment" multiple data-file="fotos" aria-label="Anexar fotografias"></span>${S.msg['up_'+e.uid]?`<span class="err-msg" style="font-size:13px">${esc(S.msg['up_'+e.uid])}</span>`:''}</div>
  ${fs.length?`<div class="photos">${fs.map((f,i)=>`<div class="ph"><div class="img"><img data-fid="${f.id}" src="${esc(fotoSrc(f))}" alt="Fotografia ${i+1}"></div><textarea data-b="e:fotos.${i}.c" id="f_${e.uid}_foto_${f.id}" placeholder="Comentário">${esc(f.c||'')}</textarea><div class="x">${S.confirm==='del-foto-'+f.id?`<button class="danger sm" data-act="del-foto-ok" data-v="${f.id}">Apagar</button><button class="sm ghost" data-act="cancel">Não</button>`:`<button class="ghost sm" data-act="ask" data-v="del-foto-${f.id}">Apagar</button>`}</div></div>`).join('')}</div>`:`<div class="empty"><b>Sem fotografias.</b><span>Cada fotografia leva um comentário que segue no relatório.</span></div>`}`}

function vAcoes(e){const cat=catOf(e);const acs=e.acoes||[];const nd=S.nova||{};
  const pecas=cat?.pecas||[];
  const filtr=nd.tipo?pecas.filter(p=>p.cat===nd.tipo):pecas;const lista=filtr.length?filtr:pecas;
  return `<div class="panel sect"><div class="sect-h"><h3>Registar ação</h3></div>
